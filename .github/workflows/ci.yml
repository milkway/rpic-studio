name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rpic
          POSTGRES_PASSWORD: rpic
          POSTGRES_DB: rpic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rpic -d rpic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rpic:rpic@localhost:5432/rpic
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Migrations
        run: |
          for f in ../../db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run e2e --workspace apps/web
